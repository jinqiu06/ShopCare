[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shopcare"
version = "0.1.0"
description = "An after-sales support agent development workspace"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "langgraph>=1,<2", "langchain-openai>=1,<2",
  "pydantic-settings>=2,<3", "sqlalchemy>=2,<3",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["shopcare"]
